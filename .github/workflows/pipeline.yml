name: DevSecOps Pipeline

on:
  push:
    branches:
      - dev
      - prod
      - k8s

env:
  IMAGE: rouhou/devsecops-app
  TAG: dev

# DEV PIPELINE
jobs:
  build-scan-push:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build image
      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG .

      # Scan secrets
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2

      # Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 0

      # Login DockerHub
      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push image
      - name: Push image
        run: docker push $IMAGE:$TAG

# PROD SECURITY CHECK
  scan-prod:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    steps:
      # Pull image from DockerHub
      - name: Pull image
        run: docker pull $IMAGE:$TAG

      # Block deployment if CRITICAL vulnerabilities
      - name: Scan image (block CRITICAL)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: $IMAGE:$TAG
          severity: CRITICAL
          exit-code: 1

# PROD DEPLOYMENT
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: runner_prod
    needs: scan-prod

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Kubernetes
        run: kubectl apply -f k8s/

# K8S MANUAL DEPLOY
  deploy-k8s:
    if: github.ref == 'refs/heads/k8s'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy K8s
        run: kubectl apply -f k8s/


# NOTIFICATION
  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/prod' && always()

    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Pipeline Status (PROD)"
          to: ${{ secrets.DEST_EMAIL_USER }}
          from: DevSecOps
          body: |
            Pipeline PROD terminé.

            Résultat du déploiement : ${{ needs.deploy.result }}

